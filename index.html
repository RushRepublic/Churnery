<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Churnery Presentation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    background: #000;
  }
  #stage {
    display: block;
  }
  .slide {
    display: block;
    width: 100%;
  }
  video.slide {
    object-fit: cover;
  }
</style>
</head>
<body>
<div id="stage">
  <video class="slide" data-src="1.mp4" muted loop playsinline preload="none"></video>
  <img class="slide" src="Churnery-01.jpg" alt="">
  <video class="slide" data-src="2.mp4" muted loop playsinline preload="none"></video>
  <img class="slide" src="Churnery-02-resized.jpg" alt="">
  <video class="slide" data-src="3.mp4" muted loop playsinline preload="none"></video>
  <img class="slide" src="Churnery-03.jpg" alt="">
  <video class="slide" data-src="4.mp4" muted loop playsinline preload="none"></video>
  <img class="slide" src="Churnery-04.jpg" alt="">
  <img class="slide" src="Churnery-05.jpg" alt="">
</div>

<script>
  let hasInteracted = false;
  function markInteracted() {
    hasInteracted = true;
  }
  ['click', 'touchstart', 'keydown', 'wheel'].forEach(evt =>
    window.addEventListener(evt, markInteracted, { once: true, passive: true })
  );

  const videos = Array.from(document.querySelectorAll('video.slide'));

  function tryPlay(video) {
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
  }

  function ensureLoaded(video) {
    if (!video.src && video.dataset.src) {
      video.src = video.dataset.src;
      video.load();
    }
  }

  // Load each video shortly before it scrolls into view, instead of all at once.
  const loadObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        ensureLoaded(entry.target);
      }
    });
  }, { rootMargin: '100% 0px' });

  const playObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting) {
        ensureLoaded(video);
        if (hasInteracted) {
          video.muted = false;
        }
        tryPlay(video);
      } else {
        video.muted = true;
        video.pause();
      }
    });
  }, { threshold: 0.5 });

  videos.forEach(video => {
    loadObserver.observe(video);
    playObserver.observe(video);
  });

  // First two videos should be ready immediately.
  if (videos[0]) ensureLoaded(videos[0]);
  if (videos[1]) ensureLoaded(videos[1]);
</script>
</body>
</html>
